name: Jest Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Run Jest Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test
        env:
          NODE_NO_WARNINGS: 1

      - name: Run coverage report
        run: npm run test:coverage
        env:
          NODE_NO_WARNINGS: 1

